<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Food | Food Ordering System</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/delete-food.js" defer></script>

    <style>
        .delete-section {
            max-width: 650px;
            margin: 60px auto;
            padding: 25px;
        }

        .delete-section h1,
        .subtitle {
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .delete-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .action-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #173d35;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .action-button:hover {
            background: #d9a441;
            color: #173d35;
        }

        .delete-button {
            background: #b42323;
            margin-top: 15px;
        }

        .delete-button:hover {
            background: #8d1515;
            color: white;
        }

        .food-details {
            margin-top: 25px;
            padding: 20px;
            background: #fff8f0;
            border: 1px solid #f0dfca;
            border-radius: 10px;
        }

        .food-details h2 {
            color: #173d35;
            margin-top: 0;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 18px;
            background: #173d35;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        @media (max-width: 500px) {
            .delete-section {
                margin: 25px auto;
                padding: 15px;
            }

            .delete-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <a class="brand" href="index.html">
    <span class="brand-mark">🍔</span>
    Sruthi Food <span>Ordering System</span>
</a>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="list-food.html">List Food</a>
            <a href="find-food.html">Find Food</a>

            <div class="dropdown">
                <button class="dropdown-btn" type="button">
                    Food Management ▼
                </button>

                <div class="dropdown-content">
                    <a href="add-food.html">Add Food</a>
                    <a href="update-food.html">Update Food</a>
                    <a class="active" href="delete-food.html">Delete Food</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="delete-section">

            <a href="index.html" class="back-button">
                ← Back to Home
            </a>

            <h1>Delete Food</h1>

            <p class="subtitle">
                Find the food item you want to remove from your menu.
            </p>

            <div class="delete-card">

                <form id="findFoodForm">
                    <div class="form-group">
                        <label for="foodId">Food ID</label>

                        <input
                            type="number"
                            id="foodId"
                            min="1"
                            placeholder="Enter the Food ID"
                            required
                        >
                    </div>

                    <button type="submit" class="action-button">
                        Find Food
                    </button>
                </form>

                <div id="foodDetails" class="food-details" hidden></div>

                <p id="message" class="message" role="status"></p>

            </div>
        </section>
    </main>

    <footer>
        <a class="brand footer-brand" href="index.html">
            <span class="brand-mark">✦</span>
            Foodie<span>Corner</span>
        </a>

        <p>Fresh ideas for a happier menu.</p>
        <small>Food Ordering System • Student Project</small>
    </footer>

</body>
</html>
